# Noctalia v5 config, managed by Nix (linked to ~/.config/noctalia/nix.toml).
#
# Noctalia merges every *.toml in ~/.config/noctalia, then applies the GUI's
# own changes from ~/.local/state/noctalia/settings.toml on top. To move GUI
# changes in here:
#   noctalia config export merged > modules/features/noctalia/config.toml
#   rm ~/.local/state/noctalia/settings.toml   # else it keeps overriding this
# (keep the [theme] section below when re-exporting)
# Docs: https://docs.noctalia.dev/v5/

# palette generated from theme.nix (see noctalia.nix)
[theme]
source = "custom"
custom_palette = "nix"
mode = "dark"

[bar.default]
auto_hide = true
radius = 0

[control_center]
hidden_tabs = [ "weather", "calendar" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
show_close_buttons = false

    [shell.animation]
    speed = 1.1000000163912773

    [shell.launcher]
    categories = false
    compact = true
    layout = "simple"

[wallpaper]
directory = "/home/nico/nix-config/wallpapers"

    [wallpaper.default]
    path = "/home/nico/nix-config/wallpapers/abstract-purple.png"

    [wallpaper.last]
    path = "/home/nico/nix-config/wallpapers/abstract-purple.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nico/nix-config/wallpapers/abstract-purple.png"

[weather]
enabled = false
