[bar.default]
auto_hide = true
center = [ "clock", "media", "notifications" ]
end = [ "tray", "clipboard", "network", "bluetooth", "control-center" ]
radius = 0
reserve_space = false
start = [ "battery", "volume", "brightness", "workspaces" ]

[control_center]
hidden_tabs = [ "weather", "calendar" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen]
transition_duration = 1000

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
show_close_buttons = false

    [shell.animation]
    speed = 1.1000000163912773

    [shell.launcher]
    categories = false
    compact = true
    layout = "simple"

[theme]
custom_palette = "nix"
mode = "dark"
source = "custom"

[wallpaper]
directory = "/home/nico/nix-config/wallpapers"

    [wallpaper.default]
    path = "/home/nico/nix-config/wallpapers/abstract-purple.png"

    [wallpaper.last]
    path = "/home/nico/nix-config/wallpapers/abstract-purple.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nico/nix-config/wallpapers/abstract-purple.png"

[weather]
enabled = false

[widget.workspaces]
style = "minimal"
