// LibreWolf overrides — shared by Linux (Nix) and Windows.
//
// Only what differs from LibreWolf's own defaults (librewolf.cfg + its
// policies.json) is listed here: LibreWolf already ships strict tracking
// protection, resistFingerprinting, HTTPS-only, no telemetry/studies/Pocket,
// no Firefox account, no form/password manager, no search suggestions, no
// speculative connections, OCSP off, etc. Re-check against librewolf.cfg when
// LibreWolf bumps its settings version (about:config -> librewolf.cfg.version).
//
// Install:
//   Linux (Nix)  appended to LibreWolf's config by packages/librewolf/librewolf.nix
//   Linux        ~/.config/librewolf/librewolf.overrides.cfg (~/.librewolf/ on older versions)
//   Windows      %USERPROFILE%\.librewolf\librewolf.overrides.cfg
//
// lockPref = set and grey out in the UI; defaultPref = default, still editable.

/****************************************************************************
 * PRIVACY: keep it usable                                                  *
 ****************************************************************************/
// LibreWolf wipes cookies + site data on every exit. Keep them (stay logged
// in); cache is still wiped. Cross-site tracking is still stopped by strict
// ETP + total cookie protection (per-site partitioning).
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);

// Anti-fingerprinting: resistFingerprinting (LibreWolf default) always tells
// sites "light theme". Same protections through fingerprintingProtection
// instead: every RFP target (canvas, fonts, timezone UTC, screen, ...) except
// prefers-color-scheme, so sites can pick their dark theme. Cost: dark mode is
// one more visible bit. If a site breaks, exempt it per site:
//   privacy.fingerprintingProtection.granularOverrides
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.pbmode", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
// ask sites for their dark theme (0 = dark, 1 = light, 2 = follow browser)
defaultPref("layout.css.prefers-color-scheme.content-override", 0);

// Block notification / location prompts outright
lockPref("permissions.default.desktop-notification", 2);
lockPref("permissions.default.geo", 2);

/****************************************************************************
 * SPEED                                                                    *
 ****************************************************************************/
// LibreWolf keeps the cache in RAM only; a disk cache is faster and lighter
// on memory, and it is still cleared on exit.
defaultPref("browser.cache.disk.enable", true);
defaultPref("network.dnsCacheExpiration", 3600); // default 60s
defaultPref("browser.sessionstore.interval", 60000); // fewer session writes (default 15s)

/****************************************************************************
 * MINIMAL: disable extra features                                          *
 ****************************************************************************/
lockPref("browser.translations.enable", false);
lockPref("browser.ml.linkPreview.enabled", false);
lockPref("browser.newtabpage.enabled", false); // blank new tab
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false); // "recommended extension" popups
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false); // "recommended feature" popups
lockPref("extensions.getAddons.cache.enabled", false); // no add-on metadata fetch from AMO

/****************************************************************************
 * URL BAR                                                                  *
 ****************************************************************************/
lockPref("browser.urlbar.suggest.topsites", false);
lockPref("browser.urlbar.suggest.openpage", false);
lockPref("browser.urlbar.groupLabels.enabled", false);
lockPref("browser.urlbar.placeholderName", "");
lockPref("browser.urlbar.trimHttps", true);
lockPref("browser.urlbar.untrimOnUserInteraction.featureGate", true);

/****************************************************************************
 * UI & BEHAVIOUR                                                           *
 ****************************************************************************/
defaultPref("browser.startup.page", 3); // restore previous session
lockPref("toolkit.legacyUserProfileCustomizations.stylesheets", true); // chrome/userChrome.css
lockPref("ui.systemUsesDarkTheme", 1);
lockPref("browser.compactmode.show", true);
// compact UI density (slightly shorter toolbars). pref(), not defaultPref():
// uidensity is a sticky pref, so a value already saved in the profile would win
pref("browser.uidensity", 1);
lockPref("browser.download.open_pdf_attachments_inline", true);
lockPref("browser.bookmarks.openInTabClosesMenu", false);
lockPref("browser.menu.showViewImageInfo", true);
lockPref("findbar.highlightAll", true);
lockPref("full-screen-api.warning.timeout", 0);
lockPref("editor.truncate_user_pastes", false); // paste long passwords into maxlength fields
lockPref("layout.word_select.eat_space_to_next_word", false); // [WINDOWS] Linux default
lockPref("browser.privateWindowSeparation.enabled", false); // [WINDOWS] no separate taskbar icon
